---
version: 3

images:
  base_image:
    name: registry.redhat.io/ansible-automation-platform-26/ee-minimal-rhel8:2.18

dependencies:
  python_interpreter:
    python_path: /usr/bin/python3.12

  galaxy:
    collections:
      - name: cisco.ios

additional_build_steps:
  # The generated GitHub Actions workflow mounts the repo's ansible.cfg into
  # /etc/ansible/ansible.cfg at build time (via --volume) and passes tokens as
  # --build-arg. If building outside the workflow (e.g. with ansible-builder
  # directly), ensure ansible.cfg is available — either mount it manually or
  # add it under additional_build_files above.
  prepend_galaxy:
    - ARG ANSIBLE_GALAXY_SERVER_AUTOMATION_HUB_TOKEN
    - ARG ANSIBLE_GALAXY_SERVER_PRIVATE_HUB_TOKEN

options:
  package_manager_path: /usr/bin/microdnf
  tags:
    - ee-network
